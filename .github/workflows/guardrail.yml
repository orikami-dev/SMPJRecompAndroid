name: Guardrail

on:
  pull_request:
  push:
    branches: [main]

jobs:
  forbidden-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse keys and game data
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)(prod|title)\.keys$|\.(nsp|xci|nca|nso|nro|nsz|keys|jks|keystore|p12)$|(^|/)(romfs|exefs)(/|$)' || true)
          if [ -n "$bad" ]; then
            echo "Forbidden files:"; echo "$bad"; exit 1
          fi
